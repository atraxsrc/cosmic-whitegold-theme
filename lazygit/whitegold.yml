# WhiteGold for lazygit, part of cosmic-whitegold-theme (MIT). Only the colours: your
# own ~/.config/lazygit/config.yml keeps the rest.
#
# Install: ./lazygit/install.sh puts this in ~/.config/lazygit/whitegold.yml and
# zsh/whitegold.zsh sets LG_CONFIG_FILE to "config.yml,whitegold.yml" so lazygit
# reads both (the later file wins). Without the zsh layer:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/whitegold.yml"
gui:
  theme:
    activeBorderColor:
      - "#655628"
      - bold
    inactiveBorderColor:
      - "#B2AF9D"
    searchingActiveBorderColor:
      - "#6C5319"
      - bold
    optionsTextColor:
      - "#665E4A"
    selectedLineBgColor:
      - "#C4C1AC"
    inactiveViewSelectedLineBgColor:
      - "#E9E6D3"
    cherryPickedCommitFgColor:
      - "#DEDBC8"
    cherryPickedCommitBgColor:
      - "#6C5319"
    markedBaseCommitFgColor:
      - "#DEDBC8"
    markedBaseCommitBgColor:
      - "#725C0A"
    unstagedChangesColor:
      - "#7A1F22"
    defaultFgColor:
      - "#0C0C14"
  authorColors:
    "*": "#6C5319"
