# WhiteGold colour scheme for qt5ct / qt6ct, part of cosmic-whitegold-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> WhiteGold, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#0c0c14, #e9e6d3, #e9e6d3, #b2af9d, #c4c1ac, #f2f0e3, #0c0c14, #000000, #0c0c14, #f2f0e3, #dedbc8, #c4c1ac, #655628, #dedbc8, #655628, #6c5319, #e9e6d3, #dedbc8, #e9e6d3, #0c0c14, #665e4a
disabled_colors=#7a7259, #e9e6d3, #e9e6d3, #b2af9d, #c4c1ac, #f2f0e3, #7a7259, #665e4a, #7a7259, #dedbc8, #dedbc8, #c4c1ac, #b2af9d, #665e4a, #665e4a, #665e4a, #e9e6d3, #dedbc8, #e9e6d3, #0c0c14, #b2af9d
inactive_colors=#0c0c14, #e9e6d3, #e9e6d3, #b2af9d, #c4c1ac, #f2f0e3, #0c0c14, #000000, #0c0c14, #f2f0e3, #dedbc8, #c4c1ac, #655628, #dedbc8, #655628, #6c5319, #e9e6d3, #dedbc8, #e9e6d3, #0c0c14, #665e4a
